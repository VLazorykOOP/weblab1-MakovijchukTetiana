<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота №6 - Варіант 10</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f9f9f9;
        }
        .canvas-container {
            background: white;
            border: 1px solid #333;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
    </style>
</head>
<body>


    <div class="canvas-container">
        <svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" 
             width="600" height="500" viewBox="0 0 600 500">

            <defs>
                <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="black" />
                </marker>
                <path id="textCurve" d="M 150,50 Q 300,10 450,50" fill="none" />
            </defs>

            <g stroke="black" stroke-width="2">
                <line x1="50" y1="250" x2="450" y2="250" marker-end="url(#arrow)" />
                <line x1="100" y1="400" x2="100" y2="50" marker-end="url(#arrow)" />
            </g>

            <g font-family="Arial" font-size="14" text-anchor="middle" fill="black">
                <line x1="150" y1="245" x2="150" y2="255" stroke="black" stroke-width="1"/> <text x="150" y="270">1</text>
                <line x1="200" y1="245" x2="200" y2="255" stroke="black" stroke-width="1"/> <text x="200" y="270">2</text>
                <line x1="250" y1="245" x2="250" y2="255" stroke="black" stroke-width="1"/> <text x="250" y="270">3</text>
                <line x1="300" y1="245" x2="300" y2="255" stroke="black" stroke-width="1"/> <text x="300" y="270">4</text>
                <line x1="350" y1="245" x2="350" y2="255" stroke="black" stroke-width="1"/> <text x="350" y="270">5</text>
                <text x="440" y="275" font-weight="bold">X</text>

                <line x1="95" y1="200" x2="105" y2="200" stroke="black" stroke-width="1"/> <text x="85" y="205">1</text>
                <line x1="95" y1="150" x2="105" y2="150" stroke="black" stroke-width="1"/> <text x="85" y="155">2</text>
                <line x1="95" y1="300" x2="105" y2="300" stroke="black" stroke-width="1"/> <text x="85" y="305">-1</text>
                <line x1="95" y1="350" x2="105" y2="350" stroke="black" stroke-width="1"/> <text x="85" y="355">-2</text>
                <text x="80" y="60" font-weight="bold">0</text>
                <text x="120" y="60" font-weight="bold">Y</text>
            </g>

            <rect x="200" y="100" width="100" height="50" fill="blue" stroke="black" />
            
            <ellipse cx="250" cy="250" rx="50" ry="100" fill="blue" stroke="black">
                 <animate attributeName="rx" values="50; 55; 50" dur="3s" repeatCount="indefinite" />
                 <animate attributeName="fill" values="blue;#0000cd;blue" dur="3s" repeatCount="indefinite" />
            </ellipse>

            <rect x="100" y="150" width="50" height="50" fill="blue" stroke="black">
                 <animate attributeName="y" values="150; 145; 150" dur="1s" repeatCount="indefinite" />
            </rect>
            <circle cx="125" cy="225" r="25" fill="blue" stroke="black" />
            <polygon points="100,300 150,300 125,250" fill="blue" stroke="black">
                 <animateTransform attributeName="transform" type="rotate" from="0 125 280" to="360 125 280" dur="6s" repeatCount="indefinite" />
            </polygon>

            <rect x="350" y="150" width="50" height="50" fill="blue" stroke="black">
                 <animate attributeName="y" values="150; 145; 150" dur="1s" repeatCount="indefinite" />
            </rect>
            <circle cx="375" cy="225" r="25" fill="blue" stroke="black" />
            <polygon points="350,300 400,300 375,250" fill="blue" stroke="black">
                 <animateTransform attributeName="transform" type="rotate" from="0 375 280" to="-360 375 280" dur="6s" repeatCount="indefinite" />
            </polygon>

            <rect x="150" y="300" width="50" height="50" fill="blue" stroke="black" />
            <rect x="300" y="300" width="50" height="50" fill="blue" stroke="black" />

            <g>
                <text font-family="Verdana" font-size="20" fill="#00008B" font-weight="bold">
                    <textPath xlink:href="#textCurve" startOffset="50%" text-anchor="middle">
                        Варіант №10
                    </textPath>
                    <animateTransform attributeName="transform" type="skewX" values="0; -10; 0; 10; 0" dur="5s" repeatCount="indefinite" />
                </text>
            </g>

        </svg>
    </div>
</body>
</html>
